<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride the Lightning · estudio</title>
<style>
  @font-face { font-family: "Geist"; src: url(/fuentes/Geist.ttf); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url(/fuentes/GeistMono.ttf); font-weight: 100 900; font-display: swap; }
  :root {
    --fondo:#1A1A17; --tarjeta:#232320; --prof:#0C0C14; --linea:#ffffff1f; --linea2:#ffffff38;
    --texto:#E4DFD6; --suave:#B8B3A9; --oro:#C9A84C; --oro-t:#1A1A17; --teal:#50B5A2; --purpura:#C27BCB; --rojo:#F08D8D;
    --r:10px; --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--fondo); color:var(--texto); font:16px/1.5 Geist, system-ui, sans-serif; }
  .mono { font-family:"Geist Mono", ui-monospace, monospace; }
  a { color:var(--oro); }
  :focus-visible { outline:3px solid var(--oro); outline-offset:2px; border-radius:6px; }
  [hidden] { display:none !important; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  svg.i { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  header { display:flex; align-items:center; gap:var(--s3); padding:12px var(--s4); border-bottom:1px solid var(--linea); position:sticky; top:0; background:var(--fondo); z-index:20; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; font-weight:800; display:flex; align-items:center; gap:10px; } header h1 b { color:var(--oro); }
  .logo { width:30px; height:30px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--linea2); font-size:13px; color:var(--suave); }
  .pill.ok { color:var(--teal); border-color:#50B5A266; } .pill.av { color:var(--oro); border-color:#C9A84C66; } .pill.mal { color:var(--rojo); border-color:#F08D8D66; }
  .esp { flex:1; }

  nav.pasos { display:flex; gap:var(--s2); padding:var(--s3) var(--s4) 0; flex-wrap:wrap; }
  nav.pasos button { display:flex; align-items:center; gap:10px; background:transparent; border:1px solid var(--linea); color:var(--suave); padding:10px 16px; min-height:48px; border-radius:999px; font:600 15px Geist; cursor:pointer; }
  nav.pasos button .n { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--tarjeta); font:700 13px "Geist Mono"; border:1px solid var(--linea2); }
  nav.pasos button[aria-current="step"] { color:var(--oro-t); background:var(--oro); border-color:var(--oro); } nav.pasos button[aria-current="step"] .n { background:var(--oro-t); color:var(--oro); border-color:var(--oro-t); }
  nav.pasos button.hecho { color:var(--texto); } nav.pasos button.hecho .n { background:var(--teal); color:#0c0c14; border-color:var(--teal); }
  nav.pasos button:disabled { opacity:.45; cursor:default; }

  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,520px); gap:var(--s4); padding:var(--s4); align-items:start; }
  @media (max-width: 1100px) { main { grid-template-columns:1fr; } .vista { position:static !important; order:-1; } }
  h2 { margin:0 0 var(--s2); font-size:28px; line-height:1.2; font-weight:800; }
  h3 { margin:var(--s4) 0 var(--s2); font-size:18px; font-weight:700; }
  .ayuda { color:var(--suave); margin:0 0 var(--s3); max-width:66ch; }
  .etq { display:block; font-weight:600; margin:0 0 6px; }
  input[type=text], input[type=search], select, textarea { width:100%; min-height:48px; background:var(--prof); color:var(--texto); border:1px solid var(--linea2); border-radius:var(--r); padding:10px 14px; font:16px Geist; }
  textarea { font:13px/1.45 "Geist Mono"; min-height:260px; white-space:pre; }
  button.btn { min-height:48px; padding:0 20px; border-radius:var(--r); border:1px solid var(--linea2); background:var(--tarjeta); color:var(--texto); font:700 16px Geist; cursor:pointer; display:inline-flex; align-items:center; gap:8px; justify-content:center; }
  button.btn:hover { border-color:var(--oro); } button.btn:active { transform:translateY(1px); }
  button.btn.p { background:var(--oro); color:var(--oro-t); border-color:var(--oro); } button.btn.p:hover { filter:brightness(1.08); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  .fila { display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; }
  .barra-nav { display:flex; justify-content:space-between; gap:var(--s3); margin-top:var(--s5); padding-top:var(--s3); border-top:1px solid var(--linea); }

  .chips { display:flex; gap:var(--s2); flex-wrap:wrap; margin:var(--s3) 0; }
  .chip { min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--linea2); background:transparent; color:var(--suave); font:600 14px Geist; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--tarjeta); color:var(--oro); border-color:var(--oro); }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:var(--s3); }
  .carta { text-align:left; background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:var(--r); padding:var(--s3); color:var(--texto); cursor:pointer; display:flex; flex-direction:column; gap:6px; min-height:150px; font:inherit; position:relative; }
  .carta:hover { border-color:var(--linea2); } .carta[aria-checked="true"], .carta[aria-pressed="true"] { border-color:var(--oro); background:#2b2a24; }
  .carta[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  .carta .tit { font-weight:700; font-size:17px; line-height:1.3; } .carta .sub { color:var(--suave); font-size:14px; } .carta .meta { font:13px "Geist Mono"; color:var(--suave); }
  .carta .marca { position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--linea2); color:transparent; }
  .carta[aria-checked="true"] .marca, .carta[aria-pressed="true"] .marca { background:var(--oro); border-color:var(--oro); color:var(--oro-t); }
  .carta .insig { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:6px; }
  .carta.tpl svg.mini { width:100%; height:84px; border-radius:6px; background:var(--prof); margin-bottom:6px; }
  .seleccion { position:sticky; bottom:0; background:linear-gradient(transparent, var(--fondo) 28%); padding:var(--s4) 0 var(--s2); margin-top:var(--s3); }
  .seleccion .caja { background:var(--tarjeta); border:1px solid var(--linea2); border-radius:var(--r); padding:var(--s2) var(--s3); display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .ficha-sel { display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 12px; background:var(--prof); border-radius:999px; border:1px solid var(--linea2); font-size:14px; }
  .ficha-sel button { width:28px; height:28px; border-radius:50%; border:0; background:#ffffff14; color:var(--texto); cursor:pointer; display:grid; place-items:center; }

  .aviso { display:flex; gap:10px; padding:12px 14px; border-radius:var(--r); border:1px solid var(--linea2); background:var(--tarjeta); margin:var(--s2) 0; font-size:15px; }
  .aviso.ok { border-color:#50B5A255; } .aviso.ok svg { color:var(--teal); } .aviso.av { border-color:#C9A84C66; } .aviso.av svg { color:var(--oro); } .aviso.mal { border-color:#F08D8D66; } .aviso.mal svg { color:var(--rojo); }
  .momento { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; align-items:start; padding:var(--s3); background:var(--tarjeta); border:1px solid var(--linea); border-radius:var(--r); margin:var(--s2) 0; }
  .momento input[type=checkbox] { width:24px; height:24px; accent-color:var(--oro); margin-top:3px; }
  .momento .expl { color:var(--suave); font-size:14px; grid-column:2; } .momento input[type=text] { min-height:44px; max-width:340px; }
  .seg { display:inline-flex; border:1px solid var(--linea2); border-radius:var(--r); overflow:hidden; }
  .seg button { min-height:48px; padding:0 18px; background:transparent; color:var(--suave); border:0; font:600 15px Geist; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--oro); color:var(--oro-t); }
  #drop { border:2px dashed var(--linea2); border-radius:var(--r); padding:var(--s4); text-align:center; color:var(--suave); }
  #drop.sobre { border-color:var(--oro); color:var(--oro); }
  .conmuta { display:flex; align-items:flex-start; gap:12px; padding:var(--s3); border:1px solid var(--linea); border-radius:var(--r); background:var(--tarjeta); }
  .conmuta input { width:24px; height:24px; accent-color:var(--oro); margin-top:2px; }

  .vista { position:sticky; top:84px; display:flex; flex-direction:column; gap:var(--s3); }
  .marco { position:relative; background:#000; border:1px solid var(--linea); border-radius:var(--r); overflow:hidden; aspect-ratio:16/9; display:grid; place-items:center; }
  .marco.vert { aspect-ratio:9/16; max-height:62vh; margin:0 auto; width:auto; }
  .marco canvas { width:100%; height:100%; display:block; }
  .marco .vacio { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:var(--s4); color:var(--suave); }
  .marco .carga { position:absolute; inset:0; background:linear-gradient(100deg,#ffffff00 20%,#ffffff12 50%,#ffffff00 80%) #101010; background-size:200% 100%; animation:brillo 1.4s linear infinite; display:grid; place-items:center; color:var(--suave); }
  @keyframes brillo { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .marco .carga { animation:none; } * { scroll-behavior:auto !important; } }
  .control { display:flex; align-items:center; gap:var(--s2); }
  .control input[type=range] { flex:1; accent-color:var(--oro); height:32px; }
  .reloj { font:14px "Geist Mono"; color:var(--suave); min-width:92px; text-align:right; }
  .simple { background:var(--tarjeta); border:1px solid var(--linea); border-radius:var(--r); padding:var(--s3); }
  .simple h3 { margin:0 0 var(--s2); font-size:16px; }
  .simple ul { list-style:none; margin:0; padding:0; display:grid; gap:8px; } .simple li { display:flex; gap:10px; align-items:flex-start; font-size:15px; }
  .simple li.ok svg { color:var(--teal); } .simple li.av svg { color:var(--oro); } .simple li.mal svg { color:var(--rojo); }
  details.det { margin-top:var(--s2); } details.det summary { cursor:pointer; min-height:40px; display:flex; align-items:center; color:var(--oro); font-weight:600; }
  .cifra { font:13px "Geist Mono"; padding:8px 10px; background:var(--prof); border-radius:8px; margin:6px 0; color:var(--texto); } .cifra small { color:var(--suave); display:block; }
  progress { width:100%; height:14px; accent-color:var(--oro); }
  .experto { display:none; } body.exp .experto { display:block; }
  .tag { font:600 12px "Geist Mono"; letter-spacing:.06em; text-transform:uppercase; color:var(--suave); }
</style>
</head>
<body>
<header>
  <h1><svg class="logo" viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="52" fill="#232320"/><polygon points="146,28 78,138 120,138 100,228 182,106 138,106" fill="#C9A84C" stroke="#FFF3C4" stroke-width="6" stroke-linejoin="round"/></svg>Ride the <b>Lightning</b></h1>
  <span class="pill" id="estadoDatos" role="status" aria-live="polite"></span>
  <span class="esp"></span>
  <button class="btn" id="btnEjemplos" aria-haspopup="true">Abrir un ejemplo</button>
  <button class="btn" id="btnExperto" aria-pressed="false">Modo experto</button>
</header>

<nav class="pasos" aria-label="Pasos para crear tu animación" id="pasos"></nav>

<main>
  <section id="paso" aria-live="polite"></section>

  <aside class="vista" aria-label="Vista previa">
    <div class="marco" id="marco">
      <canvas id="lienzo" width="960" height="540" role="img" aria-label="Vista previa de la animación"></canvas>
      <div class="vacio" id="vacio"><div><p style="font-size:20px;font-weight:700;margin:0 0 6px">Aquí verás tu animación</p><p style="margin:0">Elige un dato a la izquierda para empezar.</p></div></div>
      <div class="carga" id="carga" hidden><span>Preparando tu animación…</span></div>
    </div>
    <div class="control">
      <button class="btn" id="play" aria-label="Reproducir" style="width:56px;padding:0"></button>
      <input type="range" id="t" min="0" max="10" step="0.01" value="0" aria-label="Posición en la animación">
      <span class="reloj" id="tt"></span>
    </div>
    <div class="simple" id="simple" hidden></div>
    <div class="experto" id="expertoPanel">
      <h3>Spec (para expertos)</h3>
      <label class="sr" for="specTxt">Spec JSON</label>
      <textarea id="specTxt" spellcheck="false"></textarea>
      <div class="fila" style="margin-top:8px"><button class="btn p" id="aplicarSpec">Aplicar cambios</button><span class="ayuda" style="margin:0">Se compila y valida igual que lo demás.</span></div>
      <pre class="mono" id="expertoInforme" style="white-space:pre-wrap;font-size:12px;color:var(--suave)"></pre>
    </div>
  </aside>
</main>
<div id="ejemplos" hidden style="position:fixed;top:64px;right:24px;z-index:30;background:var(--tarjeta);border:1px solid var(--linea2);border-radius:var(--r);padding:var(--s2);min-width:280px"></div>
<script type="module" src="/web/estudio.js"></script>
</body>
</html>
