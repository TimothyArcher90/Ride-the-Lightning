<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ride the Lightning · render</title>
<style>
  @font-face { font-family: "Geist"; src: url(/fuentes/Geist.ttf); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url(/fuentes/GeistMono.ttf); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import {Escena} from '/motor/escena.js';

const lienzo = document.getElementById('c');
const ctx = lienzo.getContext('2d');
const trabajo = document.createElement('canvas');
const tctx = trabajo.getContext('2d');
let escena = null, W = 0, H = 0;

async function cargarImagenes(spec) {
  const out = {};
  const rutas = new Set((spec.imagenes ?? []));
  await Promise.all([...rutas].map((r) => new Promise((ok, mal) => {
    const im = new Image();
    im.onload = () => { out[r] = im; ok(); };
    im.onerror = () => mal(new Error('No se pudo cargar la imagen ' + r));
    im.src = '/archivos/' + r.split('/').map(encodeURIComponent).join('/');
  })));
  return out;
}

window.RTL = {
  async cargar(spec, ancho, alto) {
    await Promise.all([document.fonts.load('800 40px Geist'), document.fonts.load('500 20px "Geist Mono"'), document.fonts.load('400 20px Geist')]);
    W = lienzo.width = trabajo.width = ancho ?? spec.ancho;
    H = lienzo.height = trabajo.height = alto ?? spec.alto;
    escena = new Escena(spec, await cargarImagenes(spec));
    return {ancho: W, alto: H};
  },
  /** Dibuja el instante t. Con muestras>1 promedia subfotogramas dentro del obturador: desenfoque de movimiento real. */
  cuadro(t, {sinFondo = false, muestras = 1, obturador = 0.0167} = {}) {
    if (muestras <= 1) { escena.dibujar(ctx, W, H, t, {sinFondo}); return true; }
    // Desenfoque adaptativo: se mide cuánto se mueve la cámara dentro del obturador (en píxeles). Quieto → un solo dibujo (nítido y
    // más rápido); moviéndose → tantos subfotogramas como hagan falta para que no se vean copias fantasma.
    const env0 = escena.dibujar(tctx, W, H, t, {sinFondo, modo: 'graficas'});
    let mov = 0;
    for (const proy of Object.values(env0.proy)) {
      const s0 = proy(t - obturador / 2), s1 = proy(t + obturador / 2), B = s0.B;
      const dx = (r0, r1) => (Math.abs(r1[0] - r0[0]) + Math.abs(r1[1] - r0[1])) / Math.max(1e-9, r0[1] - r0[0]);
      mov = Math.max(mov, dx(s0.cam.x, s1.cam.x) * B.w, dx(s0.cam.y, s1.cam.y) * B.h);
    }
    ctx.clearRect(0, 0, W, H);
    if (mov < 1.5) ctx.drawImage(trabajo, 0, 0);
    else {
      const n = Math.max(2, Math.min(muestras, Math.ceil(mov / 1.5)));
      for (let k = 0; k < n; k++) {
        escena.dibujar(tctx, W, H, t + (k / (n - 1) - 0.5) * obturador, {sinFondo, modo: 'graficas'});
        ctx.globalAlpha = 1 / (k + 1);
        ctx.drawImage(trabajo, 0, 0);
      }
      ctx.globalAlpha = 1;
    }
    // texto y anotaciones: un solo dibujo, siempre nítido
    escena.dibujar(tctx, W, H, t, {sinFondo: true, modo: 'texto'});
    ctx.drawImage(trabajo, 0, 0);
    return true;
  },
  /** Auditoría de textos: cajas registradas en cada instante (títulos, contador, tarjetas, ejes, fuente). */
  auditar(tiempos) {
    return tiempos.map((t) => ({t, registro: escena.dibujar(tctx, W, H, t, {sinFondo: true}).registro}));
  },
  png() { return lienzo.toDataURL('image/png'); },
};
window.RTL_LISTO = true;
</script>
</body>
</html>
